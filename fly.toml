# Citofono su Fly.io (vedi FLY.md). Cambia "app" con un nome libero su Fly.
app = "citofono-cambiami"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# account, configurazione e certificato sopravvivono a deploy e riavvii
[[mounts]]
  source = "citofono_dati"
  destination = "/data"

# frp: ci si collega xfrpc dal monitor. TCP grezzo (niente handlers), quindi serve
# un IPv4 dedicato: fly ips allocate-v4. La macchina resta sempre accesa: se Fly
# la spegnesse, il monitor perderebbe il collegamento.
[[services]]
  protocol = "tcp"
  internal_port = 7000
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7000

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
