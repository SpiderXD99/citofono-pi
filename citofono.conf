# Configurazione della pagina dei PIN sul Raspberry Pi.
# Sta in /etc/citofono/citofono.conf. Dopo una modifica: sudo systemctl restart citofono

# IP della placca sulla tua rete (la raggiunge il Pi, porta 80). OBBLIGATORIO.
PLACCA=192.168.68.90

# Web del monitor, per cambiarne la password dalla pagina (solo da casa).
# Lascialo vuoto se non ti serve. Con https:// perche' il monitor usa HTTPS.
MONITOR=https://192.168.68.80

# Hostname pubblico del tunnel su Cloudflare (es. citofono.esempio.com). Serve
# solo a mostrare nel pannello il link raggiungibile da fuori. Si imposta dal
# pannello ("Indirizzi"); lascialo vuoto finche' non hai configurato il tunnel.
PUBBLICO=

# Dove ascolta il server sul Pi. 443 = come il monitor (il tunnel punta a 443).
INDIRIZZO=0.0.0.0
PORTA=443

# Certificato del server (autofirmato, lo crea installa.sh). Vuoti = HTTP in chiaro (solo prove).
CERT=/etc/citofono/cert.pem
CHIAVE_TLS=/etc/citofono/key.pem

# File serviti e servizi gestiti (di norma non si toccano).
PAGINA=/opt/citofono/index.html
TUNNEL_ENV=/etc/citofono/tunnel.env
SERVIZIO=citofono-tunnel.service
CLOUDFLARED=/usr/bin/cloudflared
